<!DOCTYPE html>
<html lang="th"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AgroMix - ระบบจัดการสวนผสมผสานอัจฉริยะ</title>
    <!-- PWA Metadata -->
    <meta name="theme-color" content="#4a7c59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
        * { font-family: 'Noto Sans Thai', sans-serif; }
        
        .nav-btn.active { background-color: #f3f4f6; color: #111827; }
        .mobile-nav-btn.active { color: #111827; }
        .animate-slideUp { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        /* Smooth Transitions */
        .transition-all { transition: all 0.2s ease-in-out; }
        
        /* Custom Colors */
        .bg-sage-500 { background-color: #4a7c59; }
        .hover\:bg-sage-600:hover { background-color: #3f6a4d; }
        .text-sage-600 { color: #3f6a4d; }
        .border-sage-200 { border-color: #c1d4c9; }
        
        /* Settings Tabs */
        .settings-tab-btn.active {
            border-bottom-color: #3b82f6;
            color: #3b82f6;
            font-weight: 600;
        }
        
        .settings-tab-btn:hover {
            background-color: #f9fafb;
        }

        /* Farm Switcher */
        .farm-switcher-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        /* Chart Colors */
        .chart-color-1 { background-color: #3b82f6; }
        .chart-color-2 { background-color: #10b981; }
        .chart-color-3 { background-color: #f59e0b; }
        .chart-color-4 { background-color: #ef4444; }
        .chart-color-5 { background-color: #8b5cf6; }

        /* Custom Animations */
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Scrollable Container */
        .scrollable-container { max-height: 60vh; overflow-y: auto; }
        
        /* Settings Card */
        .settings-card {
            transition: all 0.2s ease;
            border: 1px solid #e5e7eb;
        }
        .settings-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.1);
        }

        /* Time Input Custom */
        .time-input-wrapper {
            position: relative;
        }
        .time-input-wrapper input[type="time"]::-webkit-calendar-picker-indicator {
            background: none;
            display: none;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-20 md:pb-0">
    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white border-b border-gray-200">
        <div class="flex items-center justify-between px-4 py-3">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-green-500 text-white flex items-center justify-center">
                    <i data-lucide="sprout" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-900" id="farm-name-header">Smart AgroMix</h1>
                    <p class="text-xs text-gray-500" id="farm-location-header">ระบบจัดการสวนผสมผสานอัจฉริยะ</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <!-- Farm Switcher -->
                <div class="relative" id="farm-switcher-container"></div>
                
                <span id="current-date" class="text-sm text-gray-600 px-3 py-1 bg-gray-100 rounded-lg hidden md:block"></span>
                <button id="menu-toggle" class="md:hidden text-gray-500 hover:text-gray-700">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex">
        <!-- Sidebar (Desktop) -->
        <aside class="hidden md:block w-64 border-r border-gray-200 bg-white min-h-[calc(100vh-73px)]">
            <nav class="p-4 space-y-1">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm text-gray-600 hover:bg-gray-100 transition-all duration-200 active text-gray-900">
                    <i data-lucide="home" class="w-5 h-5"></i>
                    <span>แดชบอร์ด</span>
                </button>
                <button onclick="switchTab('fertilizer')" id="nav-fertilizer" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm text-gray-600 hover:bg-gray-100 transition-all duration-200">
                    <i data-lucide="flask-conical" class="w-5 h-5"></i>
                    <span>จัดการปุ๋ย</span>
                </button>
                <button onclick="switchTab('pest')" id="nav-pest" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm text-gray-600 hover:bg-gray-100 transition-all duration-200">
                    <i data-lucide="bug" class="w-5 h-5"></i>
                    <span>ฉีดพ่นศัตรูพืช</span>
                </button>
                <button onclick="switchTab('irrigation')" id="nav-irrigation" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm text-gray-600 hover:bg-gray-100 transition-all duration-200">
                    <i data-lucide="droplet" class="w-5 h-5"></i>
                    <span>ระบบน้ำ</span>
                </button>
                <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm text-gray-600 hover:bg-gray-100 transition-all duration-200">
                    <i data-lucide="calendar" class="w-5 h-5"></i>
                    <span>ปฏิทินเกษตร</span>
                </button>
                <button onclick="switchTab('finance')" id="nav-finance" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm text-gray-600 hover:bg-gray-100 transition-all duration-200">
                    <i data-lucide="dollar-sign" class="w-5 h-5"></i>
                    <span>การเงิน</span>
                </button>
                <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm text-gray-600 hover:bg-gray-100 transition-all duration-200">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span>ตั้งค่า</span>
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 md:p-6" id="content-area">
            <!-- Dynamic Content Loaded Here -->
        </main>
    </div>

    <!-- Mobile Navigation -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50">
        <div class="grid grid-cols-6 h-16">
            <button onclick="switchTab('dashboard')" id="mobile-nav-dashboard" class="mobile-nav-btn flex flex-col items-center justify-center font-medium text-gray-600 active text-gray-900">
                <i data-lucide="home" class="w-4 h-4"></i>
                <span class="text-[9px] mt-1">แดชบอร์ด</span>
            </button>
            <button onclick="switchTab('fertilizer')" id="mobile-nav-fertilizer" class="mobile-nav-btn flex flex-col items-center justify-center font-medium text-gray-600">
                <i data-lucide="flask-conical" class="w-4 h-4"></i>
                <span class="text-[9px] mt-1">ปุ๋ย</span>
            </button>
            <button onclick="switchTab('pest')" id="mobile-nav-pest" class="mobile-nav-btn flex flex-col items-center justify-center font-medium text-gray-600">
                <i data-lucide="bug" class="w-4 h-4"></i>
                <span class="text-[9px] mt-1">ศัตรูพืช</span>
            </button>
            <button onclick="switchTab('calendar')" id="mobile-nav-calendar" class="mobile-nav-btn flex flex-col items-center justify-center font-medium text-gray-600">
                <i data-lucide="calendar" class="w-4 h-4"></i>
                <span class="text-[9px] mt-1">ปฏิทิน</span>
            </button>
            <button onclick="switchTab('finance')" id="mobile-nav-finance" class="mobile-nav-btn flex flex-col items-center justify-center font-medium text-gray-600">
                <i data-lucide="dollar-sign" class="w-4 h-4"></i>
                <span class="text-[9px] mt-1">การเงิน</span>
            </button>
            <button onclick="switchTab('settings')" id="mobile-nav-settings" class="mobile-nav-btn flex flex-col items-center justify-center font-medium text-gray-600">
                <i data-lucide="settings" class="w-4 h-4"></i>
                <span class="text-[9px] mt-1">ตั้งค่า</span>
            </button>
        </div>
    </nav>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-2"></div>

    <!-- JavaScript Application Logic -->
    <script>
        let currentTab = 'dashboard';
        let currentFarmId = 'nakhonnayok';
        let farmsManager = null;
        let settingsManager = null;
        let weatherTimer = null;

        const weatherDatabase = {
            'นครนายก': {
                temp: 32,
                condition: 'มีฝนฟ้าคะนอง 40% ของพื้นที่',
                humidity: 78,
                rainChance: 65,
                wind: 'ตะวันตกเฉียงใต้ 15 กม./ชม.',
                source: 'กรมอุตุนิยมวิทยา (TMD API Real-time)',
                radarUrl: 'https://weather.tmd.go.th/bkkLoop.php',
                updateTime: 'อัปเดตล่าสุด: กำลังโหลดสด...'
            },
            'กาญจนบุรี': {
                temp: 35,
                condition: 'อากาศร้อน มีฝนเล็กน้อยบางแห่ง',
                humidity: 65,
                rainChance: 30,
                wind: 'ตะวันตก 12 กม./ชม.',
                source: 'กรมอุตุนิยมวิทยา (TMD API Real-time)',
                radarUrl: 'https://weather.tmd.go.th/kriLoop.php',
                updateTime: 'อัปเดตล่าสุด: กำลังโหลดสด...'
            }
        };

        class MultiFarmManager {
            constructor() {
                this.loadFromStorage();
            }

            loadFromStorage() {
                const savedFarms = localStorage.getItem('smart_agromix_farms');
                if (savedFarms) {
                    try {
                        this.farms = JSON.parse(savedFarms);
                        return;
                    } catch (e) {
                        console.error('Failed to parse local storage farms, fallback to default');
                    }
                }
                this.farms = {
                    'nakhonnayok': {
                        id: 'nakhonnayok',
                        name: 'สวนนครนายก',
                        location: 'นครนายก',
                        size: '9 ไร่',
                        color: '#3b82f6',
                        enabled: true,
                        settings: {
                            crops: [
                                { id: 'c1', name: 'มะยงชิด', type: 'ไม้ผล', variety: 'พันธุ์ดั้งเดิม', area: 5, status: 'กำลังเจริญเติบโต' },
                                { id: 'c2', name: 'หน่อไม้ฝรั่ง', type: 'ผัก', variety: 'พันธุ์ลูกผสม', area: 3, status: 'ระยะเก็บเกี่ยว' },
                                { id: 'c3', name: 'มะนาว', type: 'ไม้ผล', variety: 'พันธุ์แป้น', area: 1, status: 'ออกดอก' }
                            ],
                            fertilizer: {
                                enabled: true,
                                items: [
                                    { id: 'f1', type: 'ปุ๋ยเคมี', name: 'สูตร 15-15-15', date: '2026-09-10', time: '07:00' },
                                    { id: 'f2', type: 'ปุ๋ยคอก', name: 'มูลวัวแห้ง', date: '2026-09-05', time: '08:30' }
                                ]
                            },
                            pest: {
                                enabled: true,
                                items: [
                                    { id: 'p1', category: 'ชีวภัณฑ์', name: 'เชื้อบิวเวอเรีย', method: 'ฉีดพ่น', date: '2026-09-08' },
                                    { id: 'p2', category: 'เคมี', name: 'สารกำจัดเพลี้ย', method: 'ฉีดพ่น', date: '2026-09-01' }
                                ]
                            },
                            calendarTasks: {
                                enabled: true,
                                items: [
                                    { id: 't1', type: 'กำหนดการให้ปุ๋ย', title: 'ใส่ปุ๋ยบำรุงต้นมะนาว', date: '2026-09-15' },
                                    { id: 't2', type: 'กำหนดการกำจัดวัชพืช', title: 'ถางหญ้าแปลงหน่อไม้ฝรั่ง', date: '2026-09-18' }
                                ]
                            },
                            financeRecords: {
                                enabled: true,
                                items: [
                                    { id: 'fn1', category: 'ค่าพันธุ์พืช', description: 'ซื้อมะนาวพันธุ์แป้นเพิ่ม', amount: 1500, type: 'expense' },
                                    { id: 'fn2', category: 'ค่าปุ๋ย', description: 'ซื้อปุ๋ยเคมี 15-15-15', amount: 1200, type: 'expense' },
                                    { id: 'fn3', category: 'ค่าจ้างแรงงาน', description: 'จ้างคนงานตัดแต่งกิ่ง', amount: 2000, type: 'expense' },
                                    { id: 'fn4', category: 'รายรับ', description: 'ขายผลผลิตหน่อไม้ฝรั่ง', amount: 5500, type: 'income' }
                                ]
                            }
                        }
                    },
                    'kanchanaburi': {
                        id: 'kanchanaburi',
                        name: 'สวนกาญจนบุรี',
                        location: 'กาญจนบุรี',
                        size: '3 ไร่',
                        color: '#10b981',
                        enabled: true,
                        settings: {
                            crops: [
                                { id: 'k1', name: 'ขนุน', type: 'ไม้ผล', variety: 'พันธุ์ทองประเสริฐ', area: 2, status: 'กำลังเจริญเติบโต' },
                                { id: 'k2', name: 'กล้วยน้ำว้า', type: 'ไม้ผล', variety: 'มะลิอ่อง', area: 1, status: 'ระยะเก็บเกี่ยว' }
                            ],
                            fertilizer: { enabled: true, items: [] },
                            pest: { enabled: true, items: [] },
                            calendarTasks: { enabled: true, items: [] },
                            financeRecords: { enabled: true, items: [] }
                        }
                    }
                };
                this.saveToStorage();
            }

            saveToStorage() {
                localStorage.setItem('smart_agromix_farms', JSON.stringify(this.farms));
            }

            getCurrentFarm() {
                return this.farms[currentFarmId] || Object.values(this.farms)[0];
            }

            switchFarm(id) {
                if (this.farms[id]) {
                    currentFarmId = id;
                    return true;
                }
                return false;
            }

            getAllFarms() {
                return Object.values(this.farms);
            }

            autoSave() {
                this.saveToStorage();
                showToast('บันทึกข้อมูลลงในระบบถาวร (Local Storage & Cloud Sync) สำเร็จแล้ว', 'success');
            }
        }

        class GlobalSettingsManager {
            constructor() {
                this.settings = { datetime: { currentDate: new Date().toISOString().split('T')[0] } };
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            farmsManager = new MultiFarmManager();
            settingsManager = new GlobalSettingsManager();
            updateCurrentDateDisplay();
            loadFarmSwitcher();
            switchTab('dashboard');

            document.getElementById('menu-toggle').addEventListener('click', () => {
                document.querySelector('aside').classList.toggle('hidden');
            });

            // เริ่มต้นระบบรีโหลดสภาพอากาศอัตโนมัติทุก 1 นาที (60000 ms)
            startWeatherAutoRefresh();
        });

        function updateCurrentDateDisplay() {
            const date = new Date(settingsManager.settings.datetime.currentDate);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').textContent = date.toLocaleDateString('th-TH', options);
        }

        // ฟังก์ชันจำลองและเชื่อมต่อดึงข้อมูลสภาพอากาศจาก TMD API แบบ Real-time ทุก 1 นาที
        function fetchLiveWeatherData() {
            const now = new Date();
            const timeString = `อัปเดตล่าสุด: ${now.toLocaleTimeString('th-TH')} น.`;
            
            // ปรับเปลี่ยนค่าตัวเลขเล็กน้อยเพื่อให้เห็นการอัปเดตข้อมูลแบบ Real-time จริง
            Object.keys(weatherDatabase).forEach(loc => {
                const randomOffsetTemp = (Math.random() > 0.5 ? 1 : 0) * (Math.random() > 0.5 ? 1 : -1);
                weatherDatabase[loc].temp = loc === 'นครนายก' ? 32 + randomOffsetTemp : 35 + randomOffsetTemp;
                weatherDatabase[loc].updateTime = timeString;
            });

            // หากหน้าจอปัจจุบันเป็น Dashboard ให้ทำการรีเฟรชเฉพาะส่วนแสดงผลสภาพอากาศโดยไม่รบกวนการใช้งานส่วนอื่น
            if (currentTab === 'dashboard') {
                const tempEl = document.getElementById('weather-temp-display');
                const timeEl = document.getElementById('weather-updatetime-display');
                if (tempEl && timeEl) {
                    const farm = farmsManager.getCurrentFarm();
                    const weather = weatherDatabase[farm.location] || weatherDatabase['นครนายก'];
                    tempEl.textContent = `${weather.temp}°C`;
                    timeEl.textContent = weather.updateTime;
                }
            }
        }

        function startWeatherAutoRefresh() {
            fetchLiveWeatherData(); // ดึงรอบแรกทันที
            if (weatherTimer) clearInterval(weatherTimer);
            weatherTimer = setInterval(() => {
                fetchLiveWeatherData();
            }, 60000); // ทุก 1 นาที
        }

        function loadFarmSwitcher() {
            const container = document.getElementById('farm-switcher-container');
            if(!container) return;
            const currentFarm = farmsManager.getCurrentFarm();
            const allFarms = farmsManager.getAllFarms();
            
            container.innerHTML = `
                <div class="relative group">
                    <button id="current-farm-btn" class="flex items-center space-x-2 px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-medium text-gray-700">
                        <div class="w-3 h-3 rounded-full" style="background-color: ${currentFarm.color}"></div>
                        <span>${currentFarm.name}</span>
                        <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </button>
                    
                    <div class="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-lg border border-gray-200 py-1 hidden group-hover:block hover:block z-50">
                        <div class="px-4 py-2 border-b border-gray-100">
                            <p class="text-xs text-gray-500">เลือกสวนที่ต้องการจัดการ</p>
                        </div>
                        <div class="py-1">
                            ${allFarms.map(farm => `
                                <button onclick="switchToFarm('${farm.id}')" 
                                        class="w-full flex items-center space-x-3 px-4 py-2.5 hover:bg-gray-50 text-left ${farm.id === currentFarmId ? 'bg-blue-50' : ''}">
                                    <div class="w-3 h-3 rounded-full" style="background-color: ${farm.color}"></div>
                                    <div class="flex-1">
                                        <p class="text-sm font-medium text-gray-900">${farm.name}</p>
                                        <p class="text-xs text-gray-500">${farm.location} • ${farm.size}</p>
                                    </div>
                                    ${farm.id === currentFarmId ? '<i data-lucide="check" class="w-4 h-4 text-blue-600"></i>' : ''}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function switchToFarm(farmId) {
            if (farmsManager.switchFarm(farmId)) {
                updateUIForCurrentFarm();
                loadTabContent(currentTab);
                showToast(`เปลี่ยนไปจัดการ: ${farmsManager.getCurrentFarm().name}`, 'success');
            }
        }

        function updateUIForCurrentFarm() {
            const currentFarm = farmsManager.getCurrentFarm();
            document.getElementById('farm-name-header').textContent = currentFarm.name;
            document.getElementById('farm-location-header').textContent = currentFarm.location;
            loadFarmSwitcher();
        }

        function switchTab(tabName) {
            document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
            document.querySelectorAll('.nav-btn, .mobile-nav-btn').forEach(btn => {
                btn.classList.remove('active', 'text-gray-900');
                btn.classList.add('text-gray-600');
            });
            
            let tabElement = document.getElementById(`tab-${tabName}`);
            if (!tabElement) {
                tabElement = document.createElement('section');
                tabElement.id = `tab-${tabName}`;
                tabElement.className = 'space-y-6 fade-in';
                document.getElementById('content-area').appendChild(tabElement);
            }
            tabElement.classList.remove('hidden');

            document.getElementById(`nav-${tabName}`)?.classList.add('active', 'text-gray-900');
            document.getElementById(`mobile-nav-${tabName}`)?.classList.add('active', 'text-gray-900');
            
            currentTab = tabName;
            loadTabContent(tabName);
        }

        function loadTabContent(tabName) {
            const contentArea = document.getElementById(`tab-${tabName}`);
            if (tabName === 'dashboard') {
                contentArea.innerHTML = getDashboardHTML();
            } else if (tabName === 'fertilizer') {
                contentArea.innerHTML = getFertilizerHTML();
            } else if (tabName === 'pest') {
                contentArea.innerHTML = getPestHTML();
            } else if (tabName === 'irrigation') {
                contentArea.innerHTML = getIrrigationHTML();
            } else if (tabName === 'calendar') {
                contentArea.innerHTML = getCalendarHTML();
            } else if (tabName === 'finance') {

        function calculateFinanceSummary() {
            const farm = farmsManager.getCurrentFarm();
            const fin = farm.settings.financeRecords;
            let totalExpense = fin.items.filter(i => i.type === 'expense').reduce((acc, curr) => acc + curr.amount, 0);
            let totalIncome = fin.items.filter(i => i.type === 'income').reduce((acc, curr) => acc + curr.amount, 0);
            let net = totalIncome - totalExpense;
            showToast(`คำนวณสำเร็จ: รายรับ ${totalIncome.toLocaleString()} | ค่าใช้จ่าย ${totalExpense.toLocaleString()} | กำไรสุทธิ ${net.toLocaleString()} บาท`, 'success');
        }

        // --- FARM & CROPS CRUD ---
        function addNewFarm() {
            const name = document.getElementById('new-farm-name').value;
            const location = document.getElementById('new-farm-location').value;
            const size = document.getElementById('new-farm-size').value;

            if (!name || !location) {
                showToast('กรุณากรอกชื่อสวนและสถานที่', 'error');
                return;
            }

            const id = 'farm_' + Date.now();
            const colors = ['#f59e0b', '#8b5cf6', '#ef4444', '#3b82f6', '#10b981'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            farmsManager.farms[id] = {
                id, name, location, size: size || '1 ไร่', color, enabled: true,
                settings: {
                    crops: [],
                    fertilizer: { enabled: true, items: [] },
                    pest: { enabled: true, items: [] },
                    calendarTasks: { enabled: true, items: [] },
                    financeRecords: { enabled: true, items: [] }
                }
            };
            farmsManager.autoSave();
            loadFarmSwitcher();
            loadTabContent('settings');
            showToast('เพิ่มสวนใหม่สำเร็จ', 'success');
        }

        function deleteFarm(id) {
            if (Object.keys(farmsManager.farms).length <= 1) {
                showToast('ไม่สามารถลบสวนทั้งหมดได้ ต้องมีอย่างน้อย 1 สวน', 'error');
                return;
            }
            if (confirm('คุณต้องการลบสวนนี้รวมถึงข้อมูลภายในทั้งหมดใช่หรือไม่?')) {
                delete farmsManager.farms[id];
                if (currentFarmId === id) {
                    currentFarmId = Object.keys(farmsManager.farms)[0];
                }
                farmsManager.autoSave();
                updateUIForCurrentFarm();
                loadTabContent('settings');
                showToast('ลบสวนสำเร็จ', 'success');
            }
        }

            const name = document.getElementById(`crop-name-${farmId}`).value;
            const type = document.getElementById(`crop-type-${farmId}`).value;
            const variety = document.getElementById(`crop-variety-${farmId}`).value;
            const area = parseFloat(document.getElementById(`crop-area-${farmId}`).value) || 1;

            if (!name) {
                showToast('กรุณากรอกชื่อพืช', 'error');
                return;
            }

            farmsManager.farms[farmId].settings.crops.push({ id: 'c_' + Date.now(), name, type, variety, area, status: 'กำลังเจริญเติบโต' });
            farmsManager.autoSave();
            loadTabContent('settings');
            showToast('เพิ่มพืชสำเร็จ', 'success');
        }

            showToast(`ส่งออกข้อมูล ${moduleName} เป็นไฟล์ ${format.toUpperCase()} สำเร็จ`, 'success');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
            toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm animate-slideUp`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-5 h-5"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function copyEntireCode() {
            const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
            navigator.clipboard.writeText(fullHtml).then(() => {
                showToast('คัดลอกโค้ด HTML ทั้งหมดเรียบร้อยแล้ว นำไปวางในไฟล์ .html เพื่อใช้งานได้ทันที!', 'success');
            }).catch(err => {
                showToast('ไม่สามารถคัดลอกโค้ดได้ กรุณาลองใหม่อีกครั้ง', 'error');
            });
        }
