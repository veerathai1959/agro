    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
        * { font-family: 'Noto Sans Thai', sans-serif; }
        
        .nav-btn.active { background-color: #f3f4f6; color: #111827; }
        .mobile-nav-btn.active { color: #111827; }
        .animate-slideUp { animation: slideUp 0.3s ease-out; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        .transition-all { transition: all 0.2s ease-in-out; }
        
        .bg-sage-500 { background-color: #4a7c59; }
        .hover\:bg-sage-600:hover { background-color: #3f6a4d; }
        .text-sage-600 { color: #3f6a4d; }

        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .scrollable-container { max-height: 60vh; overflow-y: auto; }
        
        .settings-card {
            transition: all 0.2s ease;
            border: 1px solid #e5e7eb;
        }
        .settings-card:hover {
            border-color: #3b82f6;

        .time-input-wrapper { position: relative; }

            background: none;

        #login-modal { animation: fadeIn 0.25s ease; }

    <script>
        // =====================================================
        // AUTH TOKEN MANAGEMENT
        // =====================================================
        const AUTH_TOKEN_KEY = 'smart_agromix_token';
        const AUTH_USER_KEY = 'smart_agromix_user';

        function getToken() { return localStorage.getItem(AUTH_TOKEN_KEY); }
        function setToken(t) { localStorage.setItem(AUTH_TOKEN_KEY, t); }
        function clearAuth() { 
            localStorage.removeItem(AUTH_TOKEN_KEY); 
            localStorage.removeItem(AUTH_USER_KEY); 
            updateAuthButton();
        }
        function getCurrentUser() { 
            try { return JSON.parse(localStorage.getItem(AUTH_USER_KEY) || 'null'); } 
            catch { return null; }
        }
        function setCurrentUser(u) { 
            localStorage.setItem(AUTH_USER_KEY, JSON.stringify(u)); 
            updateAuthButton();
        }

        async function apiFetch(url, options = {}) {
            const token = getToken();
            const headers = {
                'Content-Type': 'application/json',
                ...(options.headers || {})
            };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            
            const res = await fetch(url, { ...options, headers });
            if (res.status === 401 && getToken()) {
                clearAuth();
                showLoginModal();
                throw new Error('ต้องเข้าสู่ระบบใหม่');
            }
            return res;
        }

        function updateAuthButton() {
            const btn = document.getElementById('auth-status-btn');
            const txt = document.getElementById('auth-status-text');
            if (!btn || !txt) return;
            const user = getCurrentUser();
            if (user) {
                btn.className = 'text-xs px-3 py-1.5 rounded-lg font-semibold transition-all bg-emerald-100 text-emerald-800 hover:bg-emerald-200 hidden md:block';
                txt.textContent = user.username;
            } else {
                btn.className = 'text-xs px-3 py-1.5 rounded-lg font-semibold transition-all bg-blue-100 text-blue-700 hover:bg-blue-200 hidden md:block';
                txt.textContent = 'เข้าสู่ระบบ';
            }
        }

        function handleAuthButtonClick() {
            if (getCurrentUser()) {
                if (confirm('ออกจากระบบ? ข้อมูลในเครื่องจะยังอยู่')) {
                    clearAuth();
                    showToast('ออกจากระบบแล้ว', 'success');
                    loadTabContent(currentTab);
                }
            } else {
                showLoginModal();
            }
        }

        // =====================================================
        // STATE
        // =====================================================
        let currentTab = 'dashboard';
        let currentFarmId = 'nakhonnayok';
        let farmsManager = null;
        let settingsManager = null;
        let weatherTimer = null;
        let isWeatherFetching = false;

        // ⚡ แก้ไข: cache 15 นาที ป้องกัน rate limit
        const WEATHER_CACHE_DURATION = 900000; // 15 นาที
        const WEATHER_CACHE_STORAGE_KEY = 'smart_agromix_weather_cache';

        function loadWeatherCache() {
            try {
                const cached = localStorage.getItem(WEATHER_CACHE_STORAGE_KEY);
                return cached ? JSON.parse(cached) : {};
            } catch (e) { return {}; }
        }

        function saveWeatherCache(cacheObj) {
            try { localStorage.setItem(WEATHER_CACHE_STORAGE_KEY, JSON.stringify(cacheObj)); } 
            catch (e) { console.warn('Failed to save weather cache:', e); }
        }

        const weatherCache = loadWeatherCache();

        const weatherDatabase = {
            'nakhonnayok': {
                lat: 14.263635, lon: 101.079674,
                addressDetail: 'สุดซอยเทศบาล 14 หมู่ที่ 5 ตำบลบ้านนา อำเภอบ้านนา จังหวัดนครนายก',
                temp: 32, condition: 'กำลังซิงค์ TMD & Open-Meteo API...',
                humidity: 78, rainChance: 65, wind: '10 กม./ชม.',
                source: 'TMD API & Open-Meteo',
                radarUrl: 'https://weather.tmd.go.th/bkkLoop.php',
                updateTime: 'กำลังโหลดข้อมูล...', isOffline: false,
                past7DaysRain: [12, 5, 0, 20, 8, 15, 10],
                future7DaysRain: [30, 45, 60, 25, 10, 5, 2]
            },
            'kanchanaburi': {
                lat: 14.033526, lon: 99.614506,
                addressDetail: 'บริเวณติดกับด่านเก็บเงินกาญจนบุรี ทางหลวงพิเศษระหว่างเมืองหมายเลข 81 เขตเทศบาลหนองหญ้าดอกขาว อำเภอท่าม่วง จังหวัดกาญจนบุรี',
                temp: 35, condition: 'กำลังซิงค์ TMD & Open-Meteo API...',
                humidity: 65, rainChance: 30, wind: '10 กม./ชม.',
                source: 'TMD API & Open-Meteo',
                radarUrl: 'https://weather.tmd.go.th/kriLoop.php',
                updateTime: 'กำลังโหลดข้อมูล...', isOffline: false,
                past7DaysRain: [0, 2, 0, 5, 1, 0, 4],
                future7DaysRain: [15, 20, 10, 5, 0, 0, 10]
            }
        };

        const SMART_AGROMIX_STORAGE_KEY = 'smart_agromix_farms';
        const SMART_AGROMIX_SCHEMA_VERSION = 3;
        const SMART_AGROMIX_LOG_KEY = 'smart_agromix_audit_log';
        const SMART_AGROMIX_MEMORY_STORE = Object.create(null);

        function storageGet(key) {
            try { return localStorage.getItem(key); } 
            catch (e) { 
                return Object.prototype.hasOwnProperty.call(SMART_AGROMIX_MEMORY_STORE, key)
                    ? SMART_AGROMIX_MEMORY_STORE[key] : null;
            }
        }

        function storageSet(key, value) {
            try { localStorage.setItem(key, value); return true; } 
            catch (e) { SMART_AGROMIX_MEMORY_STORE[key] = String(value); return false; }
        }

        function safeClone(value) { return JSON.parse(JSON.stringify(value)); }

        function isValidFarmData(data) {
            if (!data || typeof data !== 'object' || Array.isArray(data)) return false;
            return Object.values(data).every(f => f && typeof f === 'object' &&
                typeof f.id === 'string' && typeof f.name === 'string' &&
                f.settings && Array.isArray(f.settings.crops));
        }

        function auditLog(action, detail = '') {
            try {
                const logs = JSON.parse(storageGet(SMART_AGROMIX_LOG_KEY) || '[]');
                logs.push({ timestamp: new Date().toISOString(), action, detail });
                storageSet(SMART_AGROMIX_LOG_KEY, JSON.stringify(logs.slice(-200)));
            } catch (e) { console.warn('Audit log unavailable:', e); }
        }

        function downloadBlob(content, filename, mime = 'application/octet-stream') {
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }

        // =====================================================
        // MULTI FARM MANAGER (⚡ แก้ไขจุดวิกฤต)
        // =====================================================
        class MultiFarmManager {
            constructor() {
                this.history = [];
                this.future = [];
                this.farms = {};
                this.lastSavedSnapshot = null;
                this.cloudAvailable = null; // ⚡ เพิ่ม
            }

            async init() {
                await this.loadFromCloudOrStorage();
                this.lastSavedSnapshot = safeClone(this.farms);
            }

            async loadFromCloudOrStorage() {
                // ⚡ ถ้ามี token → ลองโหลดจาก cloud
                if (getToken()) {
                    try {
                        const response = await apiFetch('/api/farms', { method: 'GET' });
                        if (response.ok) {
                            const cloudData = await response.json();
                            if (Object.keys(cloudData).length > 0 && isValidFarmData(cloudData)) {
                                this.farms = cloudData;
                                storageSet(SMART_AGROMIX_STORAGE_KEY, JSON.stringify(cloudData));
                                this.cloudAvailable = true;
                                return;
                            }
                        }
                    } catch (e) {
                        console.warn('[Smart AgroMix] Cloud sync unavailable:', e.message);
                        this.cloudAvailable = false;
                    }
                }

                // Fallback: localStorage
                const savedFarms = storageGet(SMART_AGROMIX_STORAGE_KEY);
                if (savedFarms) {
                    try {
                        const parsed = JSON.parse(savedFarms);
                        if (isValidFarmData(parsed)) { this.farms = parsed; return; }
                    } catch (e) { console.error('Failed to load saved farms:', e); }
                }

                this.farms = this.getDefaultFarms();
                this.saveToCloudAndStorage();
            }

            getDefaultFarms() {
                return {
                    'nakhonnayok': {
                        id: 'nakhonnayok', name: 'สวนนครนายก', location: 'นครนายก',
                        lat: 14.263635, lon: 101.079674,
                        addressDetail: 'สุดซอยเทศบาล 14 หมู่ที่ 5 ตำบลบ้านนา อำเภอบ้านนา จังหวัดนครนายก',
                        radarUrl: 'https://weather.tmd.go.th/bkkLoop.php',
                        size: '9 ไร่', color: '#3b82f6', enabled: true,
                        settings: {
                            crops: [
                                { id: 'c1', name: 'มะยงชิด', type: 'ไม้ผล', variety: 'พันธุ์ดั้งเดิม', area: 5, status: 'กำลังเจริญเติบโต' },
                                { id: 'c2', name: 'หน่อไม้ฝรั่ง', type: 'ผัก', variety: 'พันธุ์ลูกผสม', area: 3, status: 'ระยะเก็บเกี่ยว' },
                                { id: 'c3', name: 'มะนาว', type: 'ไม้ผล', variety: 'พันธุ์แป้น', area: 1, status: 'ออกดอก' }
                            ],
                            fertilizer: {
                                enabled: true,
                                items: [
                                    { id: 'f1', type: 'ปุ๋ยเคมี', name: 'สูตร 15-15-15', date: '2026-09-10', time: '07:00' },
                                    { id: 'f2', type: 'ปุ๋ยคอก', name: 'มูลวัวแห้ง', date: '2026-09-05', time: '08:30' }
                                ]
                            },
                            pest: {
                                enabled: true,
                                items: [
                                    { id: 'p1', category: 'ชีวภัณฑ์', name: 'เชื้อบิวเวอเรีย', method: 'ฉีดพ่น', date: '2026-09-08' },
                                    { id: 'p2', category: 'เคมี', name: 'สารกำจัดเพลี้ย', method: 'ฉีดพ่น', date: '2026-09-01' }
                                ]
                            },
                            calendarTasks: {

            async saveToCloudAndStorage() {
                // 1. บันทึก localStorage ก่อนเสมอ
                storageSet(SMART_AGROMIX_STORAGE_KEY, JSON.stringify(this.farms));
                storageSet('smart_agromix_schema_version', String(SMART_AGROMIX_SCHEMA_VERSION));

                // 2. ลอง sync cloud (ถ้ามี token)
                if (!getToken()) {
                    this.cloudAvailable = false;
                    return true;
                }

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3000);
                    const res = await apiFetch('/api/farms', {
                        method: 'POST',
                        body: JSON.stringify(this.farms),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    this.cloudAvailable = res.ok;
                    return res.ok;
                } catch (e) {
                    // เงียบ — localStorage สำเร็จแล้ว
                    if (this.cloudAvailable !== false) {
                        console.info('[Smart AgroMix] Cloud sync unavailable — using local storage');
                        this.cloudAvailable = false;
                    }
                    return true;
                }
            }

            getCurrentFarm() {
                return this.farms[currentFarmId] || Object.values(this.farms)[0];
            }

            switchFarm(id) {
                if (this.farms[id]) { currentFarmId = id; return true; }
                return false;
            }

            getAllFarms() { return Object.values(this.farms); }

            autoSave() {
                try {
                    const previous = this.lastSavedSnapshot ? safeClone(this.lastSavedSnapshot) : null;
                    if (previous && JSON.stringify(previous) !== JSON.stringify(this.farms)) {
                        this.history.push(previous);
                        if (this.history.length > 30) this.history.shift();
                        this.future = [];
                    }
                    this.saveToCloudAndStorage().then(() => {
                        this.lastSavedSnapshot = safeClone(this.farms);
                        auditLog('save', this.cloudAvailable ? 'บันทึกขึ้น cloud + local' : 'บันทึกเฉพาะ local');
                    });
                } catch (e) { 
                    console.error(e); 
                    showToast('เกิดข้อผิดพลาดระหว่างบันทึกข้อมูล', 'error'); 
                }
            }
        }

        // =====================================================
        // SERVICE WORKER (inline)
        // =====================================================
        function registerServiceWorker() {
            if (!('serviceWorker' in navigator)) return;
            // สร้าง SW จาก Blob (ไม่ต้องมีไฟล์แยก)
            const swCode = `
                const CACHE_NAME = 'smart-agromix-v1';
                const ASSETS = ['/', '/index11.html'];
                self.addEventListener('install', (e) => {
                    e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting()));
                });
                self.addEventListener('activate', (e) => {
                    e.waitUntil(caches.keys().then(keys =>
                        Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)))
                    ).then(() => self.clients.claim()));
                });
                self.addEventListener('fetch', (e) => {
                    if (e.request.method !== 'GET') return;
                    if (e.request.url.includes('/api/') || e.request.url.includes('open-meteo.com')) return;
                    e.respondWith(
                        fetch(e.request).then(res => {
                            const clone = res.clone();
                            caches.open(CACHE_NAME).then(c => c.put(e.request, clone));
                            return res;
                        }).catch(() => caches.match(e.request))
                    );
                });
            `;
            try {
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            } catch (e) { /* ignore */ }
        }

        async function fetchWithRetry(url, options = {}, retries = 1, delay = 1000) {
            try { return await fetch(url, options); } 
            catch (error) {
                if (retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithRetry(url, options, retries - 1, delay * 2);
                }
                throw error;
            }
        }

        async function fetchLiveWeatherData() {
            if (currentTab !== 'dashboard' || isWeatherFetching) return;
            isWeatherFetching = true;

            const now = new Date();
            const timeString = `อัปเดตล่าสุด: ${now.toLocaleTimeString('th-TH')} น.`;
            const nowTime = now.getTime();
            const farmEntries = Object.entries(farmsManager.farms);

            await Promise.all(farmEntries.map(async ([farmId, farm]) => {
                let validLat = parseFloat(farm.lat);
                let validLon = parseFloat(farm.lon);
                if (isNaN(validLat) || validLat < -90 || validLat > 90) validLat = 14.0;
                if (isNaN(validLon) || validLon < -180 || validLon > 180) validLon = 100.0;

                if (!weatherDatabase[farmId]) {
                    weatherDatabase[farmId] = {
                        lat: validLat, lon: validLon, addressDetail: farm.addressDetail || farm.location,
                        temp: 32, condition: 'กำลังซิงค์ TMD & Open-Meteo...', humidity: 70, rainChance: 40,
                        wind: '10 กม./ชม.', source: 'TMD API & Open-Meteo',
                        radarUrl: farm.radarUrl || 'https://weather.tmd.go.th/bkkLoop.php',
                        updateTime: timeString, isOffline: false,
                        past7DaysRain: [5, 2, 0, 10, 4, 8, 5], future7DaysRain: [20, 35, 50, 15, 5, 0, 0]
                    };
                } else {
                    weatherDatabase[farmId].lat = validLat;
                    weatherDatabase[farmId].lon = validLon;
                    weatherDatabase[farmId].addressDetail = farm.addressDetail ?? weatherDatabase[farmId].addressDetail;
                    weatherDatabase[farmId].radarUrl = farm.radarUrl ?? weatherDatabase[farmId].radarUrl;
                }

                const farmData = weatherDatabase[farmId];
                const cacheKey = `${validLat},${validLon}`;

                if (weatherCache[cacheKey] && (nowTime - weatherCache[cacheKey].timestamp < WEATHER_CACHE_DURATION)) {
                    const cached = weatherCache[cacheKey].data;
                    farmData.temp = cached.temp;
                    farmData.humidity = cached.humidity;
                    farmData.wind = cached.wind;
                    farmData.condition = cached.condition;
                    farmData.rainChance = cached.rainChance;
                    farmData.past7DaysRain = cached.past7DaysRain || farmData.past7DaysRain;
                    farmData.future7DaysRain = cached.future7DaysRain || farmData.future7DaysRain;
                    farmData.source = 'TMD & Open-Meteo API (Cached)';
                    farmData.isOffline = false;
                    farmData.updateTime = timeString;
                    return;
                }

                const openMeteoUrl = `https://api.open-meteo.com/v1/forecast?latitude=${validLat}&longitude=${validLon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,rain,showers,cloud_cover,precipitation_probability&daily=precipitation_sum&timezone=auto`;

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000);
                    const response = await fetchWithRetry(openMeteoUrl, { signal: controller.signal }, 1, 1000);
                    clearTimeout(timeoutId);

                    if (response.status === 429) {
                        farmData.source = 'Open-Meteo (Rate Limit 429)';
                        farmData.isOffline = true;
                        return;
                    }

                    if (response && response.ok) {
                        const data = await response.json();
                        if (data.current) {
                            farmData.temp = Math.round(data.current.temperature_2m || 32);
                            if (data.current.relative_humidity_2m !== undefined) farmData.humidity = Math.round(data.current.relative_humidity_2m);
                            if (data.current.wind_speed_10m !== undefined) farmData.wind = `${data.current.wind_speed_10m} กม./ชม.`;
                            if (data.current.weather_code !== undefined) farmData.condition = getWeatherConditionText(data.current.weather_code);
                        }

                        if (data.hourly && data.hourly.time && data.hourly.time.length > 0) {
                            const startTime = new Date(data.hourly.time[0]).getTime();
                            let currentIndex = Math.floor((nowTime - startTime) / 3600000);
                            currentIndex = Math.max(0, Math.min(currentIndex, data.hourly.time.length - 1));
                            if (data.hourly.precipitation_probability && data.hourly.precipitation_probability[currentIndex] !== undefined) {
                                farmData.rainChance = Math.round(data.hourly.precipitation_probability[currentIndex]);
                            }
                        }

                        if (data.daily && data.daily.precipitation_sum && data.daily.precipitation_sum.length >= 14) {
                            const dailySums = data.daily.precipitation_sum;
                            farmData.past7DaysRain = dailySums.slice(0, 7).map(v => v || 0);
                            farmData.future7DaysRain = dailySums.slice(7, 14).map(v => v || 0);
                        }

                        farmData.source = 'Open-Meteo Weather API (Real-time)';
                        farmData.isOffline = false;

                        weatherCache[cacheKey] = {
                            timestamp: nowTime,
                            data: {
                                temp: farmData.temp, humidity: farmData.humidity, wind: farmData.wind,
                                condition: farmData.condition, rainChance: farmData.rainChance,
                                past7DaysRain: farmData.past7DaysRain, future7DaysRain: farmData.future7DaysRain
                            }
                        };
                        saveWeatherCache(weatherCache);
                    } else {
                        farmData.source = 'TMD & Open-Meteo (เชื่อมต่อขัดข้อง)';
                        farmData.isOffline = true;
                    }
                } catch (err) {
                    farmData.source = 'TMD & Open-Meteo (เครือข่ายขัดข้อง / ข้อมูลสำรอง)';
                    farmData.isOffline = true;
                }
                farmData.updateTime = timeString;
            }));

            isWeatherFetching = false;
            if (currentTab === 'dashboard') {
                const tempEl = document.getElementById('weather-temp-display');
                const timeEl = document.getElementById('weather-updatetime-display');
                if (tempEl && timeEl) {
                    const farm = farmsManager.getCurrentFarm();
                    const weather = weatherDatabase[farm.id] || Object.values(weatherDatabase)[0];
                    tempEl.textContent = `${weather.temp}°C`;
                    timeEl.textContent = weather.updateTime;
                }
            }
        }

                past7DaysRain: [0, 0, 5, 2, 10, 3, 1], future7DaysRain: [20, 40, 60, 30, 10, 0, 0]
            };
            
            let totalPastRain = (weather.past7DaysRain || []).reduce((a, b) => a + b, 0);
            let totalFutureRain = (weather.future7DaysRain || []).reduce((a, b) => a + b, 0);
            let avgFutureRain = totalFutureRain / 7;

                        <pre class="bg-gray-900 text-emerald-400 p-3 rounded-xl text-xs overflow-x-auto font-mono"><code>import requests

def fetch_tmd_weather(lat, lon, token=None):
    url = f"/api/weather/tmd"
    params = { 'lat': lat, 'lon': lon }
    headers = { 'accept': 'application/json' }
    if token:
        headers['authorization'] = f"Bearer {token}"
    try:
        response = requests.get(url, headers=headers, params=params, timeout=10)
        if response.status_code == 200:
            return response.json()
        else:
            print(f"API Error [{response.status_code}]: {response.text}")
            return None
    except requests.exceptions.RequestException as e:
        print(f"Connection Error: {e}")
        return None</code></pre>

        function updateFarmLocationInfo(farmId) {
            const farm = farmsManager.farms[farmId];
            if (!farm) return;
            const locInput = document.getElementById(`farm-loc-${farmId}`).value;
            const latInput = parseFloat(document.getElementById(`farm-lat-${farmId}`).value);
            const lonInput = parseFloat(document.getElementById(`farm-lon-${farmId}`).value);
            const radarInput = document.getElementById(`farm-radar-${farmId}`).value;
            const addressInput = document.getElementById(`farm-address-${farmId}`).value;

            if (!locInput || isNaN(latInput) || isNaN(lonInput)) {
                showToast('กรุณากรอกชื่อสถานที่และพิกัด Latitude / Longitude ให้ถูกต้อง', 'error');
                return;
            }

            farm.location = locInput;
            farm.lat = latInput;
            farm.lon = lonInput;
            farm.radarUrl = radarInput || 'https://weather.tmd.go.th/bkkLoop.php';
            farm.addressDetail = addressInput || locInput;

            weatherDatabase[farmId] = {
                lat: farm.lat, lon: farm.lon, addressDetail: farm.addressDetail,
                temp: 32, condition: 'เชื่อมโยงพิกัดใหม่สำเร็จ', humidity: 75, rainChance: 50,

                past7DaysRain: [2, 1, 4, 0, 0, 5, 2], future7DaysRain: [10, 20, 30, 10, 0, 0, 0]

            updateUIForCurrentFarm();
            loadTabContent('settings');
            startWeatherAutoRefresh();

        function calculateFinanceSummary() {
            const farm = farmsManager.getCurrentFarm();
            const fin = farm.settings.financeRecords;
            let totalExpense = fin.items.filter(i => i.type === 'expense').reduce((acc, curr) => acc + curr.amount, 0);
            let totalIncome = fin.items.filter(i => i.type === 'income').reduce((acc, curr) => acc + curr.amount, 0);
            let net = totalIncome - totalExpense;
            showToast(`คำนวณสำเร็จ: รายรับ ${totalIncome.toLocaleString()} | รายจ่าย ${totalExpense.toLocaleString()} | กำไรสุทธิ ${net.toLocaleString()} บาท`, 'success');
        }

                settings: { 
                    crops: [{ id: 'c_' + Date.now(), name: 'พืชผสมผสาน', type: 'ไม้ผล', variety: 'ทั่วไป', area: 1, status: 'กำลังปลูก' }],
                    fertilizer: { enabled: true, items: [] }, 
                    pest: { enabled: true, items: [] }, 
                    calendarTasks: { enabled: true, items: [] }, 
                    financeRecords: { enabled: true, items: [] } 
                }
            };
            farmsManager.autoSave();
            loadFarmSwitcher();
            loadTabContent('settings');
            showToast('เพิ่มสวนใหม่สำเร็จ', 'success');
        }

        function deleteFarm(id) {
            if (Object.keys(farmsManager.farms).length <= 1) { 
                showToast('ไม่สามารถลบสวนทั้งหมดได้ ต้องมีอย่างน้อย 1 สวน', 'error'); 
                return; 
            }
            if (confirm('คุณต้องการลบสวนนี้รวมถึงข้อมูลภายในทั้งหมดใช่หรือไม่?')) {
                delete farmsManager.farms[id];
                if (currentFarmId === id) currentFarmId = Object.keys(farmsManager.farms)[0];
                farmsManager.autoSave();
                updateUIForCurrentFarm();
                loadTabContent('settings');
                showToast('ลบสวนสำเร็จ', 'success');
            }
        }

        function addCropToFarm(farmId) {
            const name = document.getElementById(`crop-name-${farmId}`).value;
            const type = document.getElementById(`crop-type-${farmId}`).value;
            const variety = document.getElementById(`crop-variety-${farmId}`).value;
            const area = parseFloat(document.getElementById(`crop-area-${farmId}`).value) || 1;

            if (!name) { showToast('กรุณากรอกชื่อพืช', 'error'); return; }
            farmsManager.farms[farmId].settings.crops.push({ id: 'c_' + Date.now(), name, type, variety, area, status: 'กำลังเจริญเติบโต' });
            farmsManager.autoSave();
            loadTabContent('settings');
            showToast('เพิ่มพืชสำเร็จ', 'success');
        }

        function deleteCrop(farmId, cropId) {
            const farm = farmsManager.farms[farmId];
            farm.settings.crops = farm.settings.crops.filter(c => c.id !== cropId);
            farmsManager.autoSave();
            loadTabContent('settings');
            showToast('ลบพืชสำเร็จ', 'success');
        }

        function saveAllSettings() {
            farmsManager.autoSave();
            showToast('บันทึกการเปลี่ยนแปลงทั้งหมดเรียบร้อยแล้ว', 'success');
        }

        // =====================================================
        // EXPORT
        // =====================================================
        function exportData(moduleName, format) {
            const farm = farmsManager.getCurrentFarm();
            if (!farm) return showToast('ไม่พบข้อมูลสวน', 'error');
            const dataMap = {
                fertilizer: farm.settings.fertilizer?.items || [],
                pest: farm.settings.pest?.items || [],
                irrigation: [{ status: 'ตามระบบปัจจุบัน', morning: '06:00-06:30', evening: '17:00-17:30' }],
                calendar: farm.settings.calendarTasks?.items || [],
                finance: farm.settings.financeRecords?.items || []
            };
            const rows = dataMap[moduleName] || [];
            if (format === 'excel') {
                const keys = rows.length ? Object.keys(rows[0]) : ['ข้อมูล'];
                const th = keys.map(k => `<th>${escapeHtml(k)}</th>`).join('');
                const tr = rows.map(r => `<tr>${keys.map(k => `<td>${escapeHtml(r[k])}</td>`).join('')}</tr>`).join('');
                const workbook = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>table{border-collapse:collapse}th,td{border:1px solid #999;padding:6px}th{background:#eee}</style></head><body><table><thead><tr>${th}</tr></thead><tbody>${tr || '<tr><td>ไม่มีข้อมูล</td></tr>'}</tbody></table></body></html>`;
                downloadBlob('\uFEFF' + workbook, `SmartAgroMix_${moduleName}_${new Date().toISOString().slice(0,10)}.xls`, 'application/vnd.ms-excel;charset=utf-8');
                showToast('ส่งออกข้อมูล Excel สำเร็จ', 'success');
                return;
            }
            if (format === 'pdf') {
                const tableRows = rows.map(r => `<tr>${Object.values(r).map(v => `<td>${escapeHtml(v)}</td>`).join('')}</tr>`).join('');
                const headers = rows.length ? Object.keys(rows[0]).map(k => `<th>${escapeHtml(k)}</th>`).join('') : '<th>ไม่มีข้อมูล</th>';
                const win = window.open('', '_blank');
                if (!win) return showToast('เบราว์เซอร์บล็อกหน้าต่างพิมพ์ กรุณาอนุญาต Pop-up', 'error');
                win.document.write(`<!doctype html><html lang="th"><head><meta charset="utf-8"><title>Smart AgroMix - ${escapeHtml(moduleName)}</title><style>body{font-family:Arial,sans-serif;padding:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px;text-align:left}th{background:#f3f4f6}</style></head><body><h2>Smart AgroMix - ${escapeHtml(farm.name)}</h2><h3>${escapeHtml(moduleName)}</h3><table><thead><tr>${headers}</tr></thead><tbody>${tableRows || '<tr><td>ไม่มีข้อมูล</td></tr>'}</tbody></table><script>window.onload=()=>window.print()<\/script></body></html>`);
                win.document.close();
                return;
            }
        }

        // =====================================================
        // BACKUP / RESTORE
        // =====================================================
        function backupData() {
            const payload = { schemaVersion: SMART_AGROMIX_SCHEMA_VERSION, exportedAt: new Date().toISOString(), farms: safeClone(farmsManager.farms) };
            downloadBlob(JSON.stringify(payload, null, 2), `SmartAgroMix_Backup_${new Date().toISOString().slice(0,10)}.json`, 'application/json');
            showToast('สำรองข้อมูล JSON สำเร็จ', 'success');
        }

        function restoreData(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const payload = JSON.parse(reader.result);
                    const farms = payload.farms || payload;
                    if (!isValidFarmData(farms)) throw new Error('โครงสร้างข้อมูลไม่ถูกต้อง');
                    if (!confirm('ยืนยันการกู้คืนข้อมูลสวนจากไฟล์สำรอง? ข้อมูลปัจจุบันจะถูกแทนที่')) return;
                    const previous = safeClone(farmsManager.farms);
                    farmsManager.farms = safeClone(farms);
                    farmsManager.history = [previous];
                    farmsManager.future = [];
                    farmsManager.lastSavedSnapshot = safeClone(farmsManager.farms);
                    farmsManager.autoSave();
                    if (!farmsManager.farms[currentFarmId]) currentFarmId = Object.keys(farmsManager.farms)[0];
                    updateUIForCurrentFarm();
                    loadTabContent(currentTab);
                    showToast('กู้คืนข้อมูลสำเร็จ', 'success');
                } catch (e) {
                    showToast(`กู้คืนข้อมูลไม่สำเร็จ: ${e.message}`, 'error');
                }
            };
            reader.readAsText(file);
        }

        // =====================================================
        // TOAST
        // =====================================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
            toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm animate-slideUp`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-5 h-5"></i><span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // =====================================================
        // COPY CODE
        // =====================================================
        async function copyEntireCode() {
            const clone = document.documentElement.cloneNode(true);
            clone.querySelectorAll('input[type="file"]').forEach(el => el.value = '');
            // ล้างค่าที่ผู้ใช้อาจกรอก (ไม่บังคับ)
            const fullHtml = '<!DOCTYPE html>\n' + clone.outerHTML;
            
            const textarea = document.getElementById('code-textarea');
            if (textarea) {
                textarea.value = fullHtml;
                textarea.select();
            }

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(fullHtml);
                    showToast('คัดลอกโค้ด HTML ทั้งหมดเรียบร้อยแล้ว', 'success');
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = fullHtml; ta.style.position = 'fixed'; ta.style.opacity = '0';
                    document.body.appendChild(ta); ta.focus(); ta.select();
                    if (!document.execCommand('copy')) throw new Error('copy failed');
                    ta.remove();
                    showToast('คัดลอกโค้ด HTML ทั้งหมดเรียบร้อยแล้ว', 'success');
                }
            } catch (err) {
                showToast('กรุณากดเลือกและคัดลอกข้อความจากกล่องข้อความด้านล่างแทน', 'error');
            }
        }
    </script>
